# VoiceGuard — Docker Compose reverse proxy (single entry point on :80).
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf, so this is
# a `server` block only (the stock nginx.conf provides the events/http wrappers).
#
# Routing — everything is one origin so the SPA's same-origin "/api" calls and
# its "/ws/stream" WebSocket both work without CORS:
#   /        -> frontend container (React SPA, served by its own nginx on :80)
#   /api/    -> backend FastAPI on :8000  (the /api prefix is stripped by proxy_pass)
#   /ws/     -> backend WebSocket (live mic), prefix preserved
#   /twilio/ -> backend WebSocket (Twilio Media Streams), prefix preserved
#
# A self-hosted production deployment with TLS instead uses deploy/nginx/voiceguard.conf.

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # React SPA (the frontend container runs its own nginx with the SPA fallback).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend — /api/* is proxied to the app root (the trailing slash on
    # proxy_pass strips the prefix). e.g. /api/detect -> backend:8000/detect
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket — live-mic stream. Prefix preserved: /ws/stream -> backend:8000/ws/stream
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # WebSocket — Twilio Media Streams bridge. Prefix preserved.
    location /twilio/ {
        proxy_pass http://backend:8000/twilio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
