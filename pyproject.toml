[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voiceguard"
version = "0.1.0"
description = "Real-time voice deepfake detection and vishing defence platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
  {name = "Mohammad Thabet Hassan", email = "MohammadThabetHassan@users.noreply.github.com"},
  {name = "Fahad Sadek Al-Jazzeri",  email = "fahadALjazzeri@users.noreply.github.com"},
  {name = "Ahmed Sami Alameri",       email = "AhmedSamiAlameri@users.noreply.github.com"},
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.bandit]
targets = ["src"]
skips = ["B101"]
