[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceguard"
version = "0.1.0"
description = "Real-time voice deepfake detection and vishing defence platform"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
  {name = "Mohammad Thabet Hassan", email = "MohammadThabetHassan@users.noreply.github.com"},
  {name = "Fahad Sadek Al-Jazzeri",  email = "fahadALjazzeri@users.noreply.github.com"},
  {name = "Ahmed Sami Alameri",       email = "AhmedSamiAlameri@users.noreply.github.com"},
]

dependencies = [
  # Deep learning
  "torch>=2.1.0",
  "torchaudio>=2.1.0",
  # Audio processing
  "librosa>=0.10.1",
  "soundfile>=0.12.1",
  "webrtcvad>=2.0.10",
  # Classical ML
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.3",
  "joblib>=1.3.2",
  # NLP / transformers
  "transformers>=4.37.0",
  "datasets>=2.16.1",
  # API
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.25.0",
  "python-multipart>=0.0.6",
  "python-jose[cryptography]>=3.3.0",
  "slowapi>=0.1.9",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "httpx>=0.26.0",
  # XAI
  "captum>=0.7.0",
  "shap>=0.44.0",
  # Forensics
  "reportlab>=4.0.0",
  # ONNX
  "onnx>=1.15.0",
  "onnxruntime>=1.17.0",
  # Data
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scipy>=1.11.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "black>=23.12.0",
  "bandit>=1.7.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101", "S603", "S607", "N803", "N806", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"

[tool.bandit]
targets = ["src"]
skips = ["B101", "B311"]
