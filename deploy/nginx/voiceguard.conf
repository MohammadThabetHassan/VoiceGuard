# VoiceGuard — Nginx reverse proxy (SSL termination + static frontend + API proxy)
#
# Placeholders replaced by deploy/setup.sh:
#   YOUR_DOMAIN  ->  your real domain (e.g. voiceguard.tech)
# Certbot fills in the ssl_certificate lines automatically (`certbot --nginx`).
#
# Routing:
#   /        -> React SPA build in /var/www/voiceguard/dist (try_files -> index.html)
#   /api/    -> FastAPI on 127.0.0.1:8000  (the /api prefix is stripped by proxy_pass)
#   /ws/     -> FastAPI WebSocket on 127.0.0.1:8000/ws/ (prefix preserved)
#   /twilio/ -> FastAPI WebSocket on 127.0.0.1:8000/twilio/ (Twilio Media Streams)

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # SSL — filled in by Certbot automatically
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (X-XSS-Protection is deprecated and intentionally absent).
    # nginx gotcha: any location with its own add_header DROPS these server-level
    # ones, so the SPA and static-asset blocks below repeat the full set.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # 'unsafe-inline' style: React style={} attributes; wss: for /ws/stream.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'self'";

    # Serve React frontend (static build)
    root /var/www/voiceguard/dist;
    index index.html;

    # SPA fallback — all non-asset, non-API routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        # Re-declare: this block's add_header voids the server-level set.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'self'";
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-declare: this block's add_header voids the server-level set.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # FastAPI backend — /api/* is proxied to the app root (prefix stripped by the
    # trailing slash on proxy_pass). e.g. /api/detect -> 127.0.0.1:8000/detect
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;
    }

    # WebSocket for the live-mic stream. Prefix is preserved so the backend's
    # /ws/stream endpoint is reachable at wss://YOUR_DOMAIN/ws/stream
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Twilio Media Streams bridge — Twilio connects here (wss://YOUR_DOMAIN/twilio/stream).
    # Host must be preserved: the backend rebuilds the public URL from it to
    # validate X-Twilio-Signature.
    location /twilio/ {
        proxy_pass http://127.0.0.1:8000/twilio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Block access to dotfiles
    location ~ /\. { deny all; }
}
